name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

      - name: Create RDP User
        shell: powershell
        run: |
          $chars = (
            (65..90) +
            (97..122) +
            (48..57)
          )

          $password = -join (
            1..24 | ForEach-Object {
              [char]($chars | Get-Random)
            }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download WebRDP
        shell: powershell
        run: |
          git clone https://github.com/Mikej81/WebRDP.git

          Set-Location WebRDP

          npm install

          npm run build

      - name: Start WebRDP
        shell: powershell
        run: |
          Set-Location WebRDP

          Start-Process `
            -FilePath "node.exe" `
            -ArgumentList "app.js" `
            -WorkingDirectory (Get-Location) `
            -WindowStyle Hidden

          Write-Host "Waiting for WebRDP..."

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {

            Start-Sleep -Seconds 2

            try {
              $response = Invoke-WebRequest `
                -Uri "http://127.0.0.1:4200/" `
                -UseBasicParsing `
                -TimeoutSec 5

              if ($response.StatusCode -ge 200) {
                $ready = $true
                break
              }

            } catch {
              Write-Host "WebRDP not ready yet..."
            }
          }

          if (-not $ready) {
            Write-Error "WebRDP failed to start."

            Get-Process node -ErrorAction SilentlyContinue

            exit 1
          }

          Write-Host "WebRDP is running on port 4200."

      - name: Download Cloudflared
        shell: powershell
        run: |
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          $path = "$env:RUNNER_TEMP\cloudflared.exe"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $path

          & $path --version

      - name: Start Cloudflare Quick Tunnel
        shell: powershell
        run: |

          $cloudflared = "$env:RUNNER_TEMP\cloudflared.exe"

          $metricsPort = 55555

          $logFile = "$env:RUNNER_TEMP\cloudflared.log"

          $errorFile = "$env:RUNNER_TEMP\cloudflared-error.log"

          Write-Host "Starting Cloudflare Quick Tunnel..."

          Start-Process `
            -FilePath $cloudflared `
            -ArgumentList @(
              "tunnel",
              "--no-autoupdate",
              "--metrics",
              "127.0.0.1:$metricsPort",
              "--url",
              "http://127.0.0.1:4200"
            ) `
            -RedirectStandardOutput $logFile `
            -RedirectStandardError $errorFile `
            -WindowStyle Hidden

          Write-Host "Waiting for Cloudflare..."

          $hostname = $null

          for ($i = 1; $i -le 60; $i++) {

            Start-Sleep -Seconds 2

            try {

              $result = Invoke-RestMethod `
                -Uri "http://127.0.0.1:$metricsPort/quicktunnel" `
                -TimeoutSec 3

              if ($result.hostname) {

                $hostname = $result.hostname

                Write-Host "Cloudflare hostname found:"
                Write-Host $hostname

                break
              }

            } catch {

              Write-Host "Waiting for tunnel..."

            }
          }

          if (-not $hostname) {

            Write-Host ""
            Write-Host "========== CLOUDFLARE OUTPUT =========="

            if (Test-Path $logFile) {
              Get-Content $logFile
            }

            if (Test-Path $errorFile) {
              Get-Content $errorFile
            }

            Write-Host "========================================"

            Write-Error "Cloudflare Quick Tunnel did not provide a hostname."

            exit 1
          }

          "CLOUDFLARE_HOSTNAME=$hostname" >> $env:GITHUB_ENV

      - name: Test WebRDP Through Localhost
        shell: powershell
        run: |

          Write-Host "Testing WebRDP..."

          $response = Invoke-WebRequest `
            -Uri "http://127.0.0.1:4200/" `
            -UseBasicParsing

          Write-Host "WebRDP HTTP status:"
          Write-Host $response.StatusCode

      - name: Show Connection Information
        shell: powershell
        run: |

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "              RDP IS READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "OPEN THIS URL:"
          Write-Host ""
          Write-Host "https://$env:CLOUDFLARE_HOSTNAME/rdp/host/127.0.0.1"
          Write-Host ""
          Write-Host "USERNAME:"
          Write-Host "RDP"
          Write-Host ""
          Write-Host "PASSWORD:"
          Write-Host "$env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "=============================================="
          Write-Host ""

      - name: Keep RDP Alive
        shell: powershell
        run: |

          while ($true) {

            Write-Host "RDP is active: $(Get-Date)"

            Start-Sleep -Seconds 300
          }
