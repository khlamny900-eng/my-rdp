name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:

      # ==========================================
      # 1. Enable RDP
      # ==========================================
      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..."

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

          Restart-Service TermService -Force

          Write-Host "RDP enabled."

      # ==========================================
      # 2. Create RDP User
      # ==========================================
      - name: Create RDP User
        shell: powershell
        run: |
          Write-Host "Creating RDP user..."

          $chars = (
            [char[]](65..90) +
            [char[]](97..122) +
            [char[]](48..57) +
            [char[]](33..47)
          )

          $password = -join (
            1..28 | ForEach-Object {
              $chars | Get-Random
            }
          )

          $securePassword = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          $existing = Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue

          if ($existing) {
            Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
            -Name "RDP" `
            -Password $securePassword `
            -AccountNeverExpires `
            -PasswordNeverExpires

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP"

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          "RDP_USERNAME=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          Write-Host "RDP user created."

      # ==========================================
      # 3. Verify RDP
      # ==========================================
      - name: Verify RDP
        shell: powershell
        run: |
          Write-Host "Checking RDP port 3389..."

          $ready = $false

          for ($i = 1; $i -le 20; $i++) {

            $connection = Get-NetTCPConnection `
              -LocalPort 3389 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($connection) {
              $ready = $true
              break
            }

            Write-Host "Waiting for RDP..."
            Start-Sleep -Seconds 2
          }

          if (-not $ready) {
            Write-Error "RDP port 3389 is not listening."
            exit 1
          }

          Write-Host "RDP port 3389 is listening."

      # ==========================================
      # 4. Download WebRDP
      # ==========================================
      - name: Download WebRDP
        shell: powershell
        run: |
          git clone https://github.com/Mikej81/WebRDP.git

          Set-Location WebRDP

          npm install

          npm run build

      # ==========================================
      # 5. Start WebRDP
      # ==========================================
      - name: Start WebRDP
        shell: powershell
        run: |
          Set-Location WebRDP

          $env:LISTEN_IP = "0.0.0.0"
          $env:LISTEN_PORT = "4200"
          $env:RDP_DEFAULT_PORT = "3389"
          $env:SESSION_SECRET = [guid]::NewGuid().ToString()

          Write-Host "Starting WebRDP..."
          Write-Host "Listening on 0.0.0.0:4200"

          $stdout = "$env:RUNNER_TEMP\webrdp-out.log"
          $stderr = "$env:RUNNER_TEMP\webrdp-error.log"

          Start-Process `
            -FilePath "node" `
            -ArgumentList "app.js" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden

          $ready = $false

          for ($i = 1; $i -le 30; $i++) {

            $connection = Get-NetTCPConnection `
              -LocalPort 4200 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($connection) {
              $ready = $true
              break
            }

            Write-Host "WebRDP not ready yet..."
            Start-Sleep -Seconds 2
          }

          if (-not $ready) {

            Write-Host "========== WebRDP STDOUT =========="

            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            Write-Host "========== WebRDP STDERR =========="

            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            Write-Error "WebRDP failed to start."
            exit 1
          }

          Write-Host "WebRDP is listening on port 4200."

      # ==========================================
      # 6. Install Cloudflared
      # ==========================================
      - name: Install Cloudflared
        shell: powershell
        run: |
          $url = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"

          $path = "$env:RUNNER_TEMP\cloudflared.exe"

          Write-Host "Downloading cloudflared..."

          Invoke-WebRequest `
            -Uri $url `
            -OutFile $path

          if (-not (Test-Path $path)) {
            Write-Error "cloudflared download failed."
            exit 1
          }

          & $path --version

          "CLOUDFLARED_PATH=$path" >> $env:GITHUB_ENV

      # ==========================================
      # 7. Start Cloudflare Tunnel
      # ==========================================
      - name: Start Cloudflare Tunnel
        shell: powershell
        run: |
          $cloudflared = $env:CLOUDFLARED_PATH

          $stdout = "$env:RUNNER_TEMP\cloudflared-out.log"
          $stderr = "$env:RUNNER_TEMP\cloudflared-error.log"

          Remove-Item $stdout,$stderr -Force -ErrorAction SilentlyContinue

          Write-Host "Starting Cloudflare Quick Tunnel..."
          Write-Host "Target: http://127.0.0.1:4200"

          Start-Process `
            -FilePath $cloudflared `
            -ArgumentList "tunnel --no-autoupdate --url http://127.0.0.1:4200" `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -WindowStyle Hidden

          $publicUrl = $null

          for ($i = 1; $i -le 60; $i++) {

            Start-Sleep -Seconds 2

            $content = ""

            if (Test-Path $stdout) {
              $content += Get-Content $stdout -Raw -ErrorAction SilentlyContinue
            }

            if (Test-Path $stderr) {
              $content += Get-Content $stderr -Raw -ErrorAction SilentlyContinue
            }

            if ($content) {

              $match = [regex]::Match(
                $content,
                'https://[a-zA-Z0-9-]+\.trycloudflare\.com'
              )

              if ($match.Success) {
                $publicUrl = $match.Value
                break
              }
            }

            Write-Host "Waiting for Cloudflare Tunnel..."
          }

          if (-not $publicUrl) {

            Write-Host ""
            Write-Host "========== CLOUDFLARED STDOUT =========="

            if (Test-Path $stdout) {
              Get-Content $stdout
            }

            Write-Host ""
            Write-Host "========== CLOUDFLARED STDERR =========="

            if (Test-Path $stderr) {
              Get-Content $stderr
            }

            Write-Error "Could not obtain Cloudflare Tunnel URL."
            exit 1
          }

          "PUBLIC_URL=$publicUrl" >> $env:GITHUB_ENV

          Write-Host ""
          Write-Host "=============================================="
          Write-Host "       CLOUDFLARE TUNNEL READY"
          Write-Host "=============================================="
          Write-Host ""
          Write-Host "PUBLIC URL:"
          Write-Host $publicUrl
          Write-Host ""
          Write-Host "=============================================="

      # ==========================================
      # 8. Verify WebRDP
      # ==========================================
      - name: Verify WebRDP
        shell: powershell
        run: |
          Write-Host "Testing local WebRDP..."

          $connection = Get-NetTCPConnection `
            -LocalPort 4200 `
            -State Listen `
            -ErrorAction SilentlyContinue

          if (-not $connection) {
            Write-Error "WebRDP is no longer listening on port 4200."
            exit 1
          }

          Write-Host "WebRDP is listening."

          try {

            $response = Invoke-WebRequest `
              -Uri "http://127.0.0.1:4200/" `
              -UseBasicParsing `
              -TimeoutSec 15

            Write-Host "HTTP Status: $($response.StatusCode)"

          } catch {

            Write-Host "WebRDP HTTP response:"
            Write-Host $_
          }

      # ==========================================
      # 9. Show Login Information
      # ==========================================
      - name: Show RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "===================================================="
          Write-Host "                 WEB RDP READY"
          Write-Host "===================================================="
          Write-Host ""
          Write-Host "OPEN THIS:"
          Write-Host ""
          Write-Host "$env:PUBLIC_URL/rdp/host/127.0.0.1"
          Write-Host ""
          Write-Host "USERNAME:"
          Write-Host "$env:RDP_USERNAME"
          Write-Host ""
          Write-Host "PASSWORD:"
          Write-Host "$env:RDP_PASSWORD"
          Write-Host ""
          Write-Host "===================================================="
          Write-Host "             DO NOT STOP THIS ACTION"
          Write-Host "===================================================="
          Write-Host ""

      # ==========================================
      # 10. Keep Runner Alive
      # ==========================================
      - name: Keep RDP Alive
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "RDP + WebRDP + Cloudflare Tunnel are ACTIVE."
          Write-Host ""

          while ($true) {

            Write-Host "[$(Get-Date)] RDP is active."

            Start-Sleep -Seconds 300
          }
